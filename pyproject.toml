[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hg-toolkit"
dynamic = ["version"]
description = "High-performance command-line interface for HunterGround operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "PyYAML>=6,<7",
    "jsonschema>=4.18,<5",
    "keyring>=24,<26",
    "certifi>=2024.2.2",
    "rich>=13,<15",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [{name = "HunterGround"}]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://hunterground.io"

[project.scripts]
hg = "hg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hg = ["py.typed", "schema/*.json", "schema/*.yaml", "templates/**/*"]

[tool.setuptools.dynamic]
version = {attr = "hg.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
